# Odoo 20 del despacho en el SERVIDOR (preproducción o producción). Lo arranca instalar.sh; ver LEEME.md.
# Diferencias con odoo/docker-compose.yml (desarrollo): HTTPS con Caddy, Odoo y PostgreSQL sin puertos abiertos,
# varios procesos de Odoo (workers), contraseñas propias en .env y configuración en odoo.conf (ambos solo en el
# servidor, nunca en el repositorio).
name: despacho_${ENTORNO:-preproduccion}
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: postgres
    volumes:
      - db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      retries: 10

  odoo:
    build: ../odoo
    image: despacho/odoo:20
    depends_on:
      db:
        condition: service_healthy
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]
    environment:
      SP_CLAVE_CIFRADO: ${SP_CLAVE_CIFRADO:?Falta SP_CLAVE_CIFRADO en .env}
      SP_EB_APP_ID: ${SP_EB_APP_ID:-}
      SP_EB_CLAVE: ${SP_EB_CLAVE:-}
      TZ: Europe/Madrid
    volumes:
      - odoo:/var/lib/odoo
      - ../odoo/addons:/mnt/extra-addons:ro
      - ../odoo/configuracion:/configuracion:ro
      - ../odoo/pruebas:/pruebas:ro
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ./secretos:/secretos:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on: [odoo]
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env}
      CORREO_TLS: ${CORREO_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  db:
  odoo:
  caddy_data:
  caddy_config:
