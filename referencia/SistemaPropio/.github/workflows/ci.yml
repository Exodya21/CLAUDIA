name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: sistema, POSTGRES_PASSWORD: ci_only, POSTGRES_DB: sistema_propio_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: {run: {working-directory: apps/api}}
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sistema:ci_only@localhost:5432/sistema_propio_test
      RESTORE_TEST_DATABASE_URL: postgresql+psycopg://sistema:ci_only@localhost:5432/sistema_propio_restore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa poppler-utils fonts-dejavu-core
      - run: pip install ".[dev]"
      # AT-29: base auxiliar donde se restauran las copias (pg_dump/pg_restore 16 vienen en el runner)
      - run: PGPASSWORD=ci_only createdb -h localhost -U sistema sistema_propio_restore_test
      - run: ruff check app tests
      - run: pytest -v
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  trazabilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install openpyxl && python scripts/build_coverage.py
      - run: git diff --exit-code docs/producto  # el mapa generado debe estar al día
